<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="GeoINR hero image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f1e8"/>
      <stop offset="100%" stop-color="#e7eef4"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#004e7c"/>
      <stop offset="100%" stop-color="#0f6b9e"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c58b00"/>
      <stop offset="100%" stop-color="#e0a600"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c8a21"/>
      <stop offset="100%" stop-color="#80a728"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <g transform="translate(120,90)">
    <polygon points="0,170 260,50 700,140 440,260" fill="url(#layer1)" opacity="0.96"/>
    <polygon points="0,205 260,85 700,175 440,295" fill="url(#layer2)" opacity="0.93"/>
    <polygon points="0,240 260,120 700,210 440,330" fill="url(#layer3)" opacity="0.9"/>
    <polyline points="30,157 170,105 335,132 510,174 650,203" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polyline points="80,194 230,138 402,167 560,205 670,230" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g transform="translate(780,85)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="56" fill="#1f3a56">GeoINR</text>
    <text x="0" y="58" font-family="Georgia, serif" font-size="28" fill="#1f3a56">Implicit 3D Geological Modeling</text>
    <text x="0" y="102" font-family="Georgia, serif" font-size="20" fill="#2c4f70">
      API-first workflow, stratigraphy, faults, and neural solvers.
    </text>
  </g>
</svg>
